# Continuous integration for EMS (personal portfolio project).
# Builds and tests the .NET backend and the ems-web frontend on every push and
# pull request. Every failure is written as an annotation on the check run so it
# can be read without opening the raw logs.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # setup-dotnet also registers the .NET problem matcher, which turns
      # compiler errors in the build output into file/line annotations.
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore EmployeeManagementSystem.sln

      # Default output layout (no --output): the architecture tests find the
      # repository root relative to bin/<Configuration>/net9.0.
      - name: Build
        run: dotnet build EmployeeManagementSystem.sln --configuration Release --no-restore

      - name: Test
        id: test
        run: >
          dotnet test EmployeeManagementSystem.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Report failed tests
        if: ${{ always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: |
          flag=""
          if [ "${{ steps.test.outcome }}" = "failure" ]; then flag="--test-step-failed"; fi
          python3 .github/scripts/report-trx-failures.py "${{ github.workspace }}/TestResults" $flag

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-test-results
          path: TestResults/**/*.trx
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ems-web
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ems-web/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      # Lint, test and build each run even if an earlier one failed, so every
      # problem is reported in a single run.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          npm run lint -- --format json --output-file "$RUNNER_TEMP/eslint-report.json"
          lint_status=$?
          node ../.github/scripts/eslint-annotations.mjs "$RUNNER_TEMP/eslint-report.json"
          annotate_status=$?
          if [ $lint_status -ne 0 ] || [ $annotate_status -ne 0 ]; then exit 1; fi

      # The github-actions reporter writes one ::error annotation per failed test.
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --reporter=default --reporter=github-actions

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          npm run build 2>&1 | tee "$RUNNER_TEMP/next-build.log"
          build_status=${PIPESTATUS[0]}
          if [ $build_status -ne 0 ]; then
            bash ../.github/scripts/next-build-annotation.sh "$RUNNER_TEMP/next-build.log" ems-web
            exit $build_status
          fi
